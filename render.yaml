services:
  - type: web
    name: reinscripcion-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # Plan Starter Professional
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER_ENVIRONMENT
        value: true
      - key: NODE_OPTIONS
        value: --max-old-space-size=768
      - key: DATABASE_URL
        fromDatabase:
          name: reinscripcion-db
          property: connectionString
      - key: INNOVAT_USER
        sync: false
      - key: INNOVAT_PASS
        sync: false
      - key: INNOVAT_SCHOOL
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: echo "Build handled by Dockerfile"
    startCommand: bun run start
    # Configuración optimizada para Starter
    disk:
      name: reinscripcion-disk
      mountPath: /app/upload
      sizeGB: 1
    # Timeouts extendidos para sincronización de Innovat
    maxShutdownDelaySeconds: 30
    
databases:
  - name: reinscripcion-db
    databaseName: reinscripcion
    user: reinscripcion_user
